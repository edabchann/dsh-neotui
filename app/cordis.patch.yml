# The dsh-neotui-app bundle patch: the terminal surface over the dsh-base layer.
#
# --attach mode (coexists with a running web UI): the local host plane is
# disabled below and these disk-backed rows redirect to a throwaway directory,
# so the attached process never touches the shared $DSH_HOME storage while the
# TUI speaks to the already-running host.

# ── attach-mode isolation: bare id-addressed rows override base rows (0.1.2 semantics: last write wins per row) ──

- id: session-persistence-jsonl
  inject: [tuiStartup]
  config:
    root: !!js (ctx.tuiStartup.attach && (process.env.TMPDIR ?? '/tmp') + '/dsh-neotui-attach/sessions' || dshHomePath('sessions'))

- id: settings
  inject: [tuiStartup]
  config:
    path: !!js (ctx.tuiStartup.attach && (process.env.TMPDIR ?? '/tmp') + '/dsh-neotui-attach/settings.yaml' || dshHomePath('settings.yaml'))

- id: credentials
  inject: [tuiStartup]
  config:
    path: !!js (ctx.tuiStartup.attach && (process.env.TMPDIR ?? '/tmp') + '/dsh-neotui-attach/.credentials.yaml' || dshHomePath('.credentials.yaml'))

# 0.1.2: the base layer owns the storage stack; attach isolation is a bare
# id-addressed override (a patch row REPLACES the targeted row's whole config).
- id: storage-json
  inject: [tuiStartup]
  config:
    root: !!js (ctx.tuiStartup.attach && (process.env.TMPDIR ?? '/tmp') + '/dsh-neotui-attach/storages' || dshHomePath('storages'))

# The dsh-neotui-app bundle patch: the terminal surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here add the API surface the TUI
# client speaks (HTTP unary + WS frame streams) plus the two tui rows.
#
# The base layer deliberately keeps the agent plane (tools, skills, goal,
# plan, compaction, subagents) enabled: the TUI is single-session and
# composes its agent process-wide.

- insert:
    # Ordinary provider for the parsed TUI flags (--host/--port/--session/--cwd).
    - id: tui-startup
      name: 'dsh-neotui-app/startup'

    # Plain route-registration carrier; host/port come from the tui-startup
    # provider. Default port 0 = OS-picked (the TUI reads the real port from
    # the webServer service in-process; no fixed port is required).
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [tuiStartup]
      config:
        host: !!js ctx.tuiStartup.host ?? '127.0.0.1'
        port: !!js ctx.tuiStartup.port ?? 0

    # 0.1.2: the unary/WS API surface (former dsh-host-apiproxy) is owned by
    # the connection row's node half (gateway bound under /api).
    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    # The API gateway requires a directory picker (host-side chooser service).
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # Owns both ends of the transport: node half binds the gateway to the
    # webserver under /api (plus the events.mux/events.host WebSocket
    # downlinks); the TUI client speaks the same wire protocol.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [tuiStartup]
      config:
        trustedHosts: []

    # Host services the TUI surface calls that the base layer does not mount.
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-log-export
      name: '@deepseek-ai/dsh-session-log-export'

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Read-only projection of current Loader entries (ControlPanel 插件页).
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # The TUI application: waits for the embedded webserver port, then takes
    # over stdin/stdout (alternate screen, SGR mouse, polling client) and
    # disposes with the tree.
    - id: tui-runtime
      name: 'dsh-neotui-app'
      inject: [tuiStartup]
